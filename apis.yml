name: RecommerceX
description: 'RecommerceX is an engineering-driven manufacturing company applying circular-economy
  practices to transform industrial waste into advanced engineering materials. It operates three
  flagship brands: RexSteel (seamless and ERW stainless steel pipes, tubes, forgings, flanges and
  heat-exchanger tubes), RexPol (HDPE and DWC polymer pipes, polymer compounds and engineering
  plastics), and RexTherm (critical infrastructure including liquid cooling, heat exchangers, power
  components and acoustics). It serves oil & gas, chemical, pharmaceutical, infrastructure, automotive,
  water, power and industrial manufacturing sectors. Surfaced as a portfolio company of accel and added
  to the API Evangelist network; the public site publishes no API, SDK, developer portal, or
  documentation surface.'
